  <rect x="72" y="54" width="716" height="212" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(232,236,240,0.13)"/>
  <line x1="120" y1="230.5" x2="740" y2="230.5" stroke="rgba(232,236,240,0.18)"/>
  <line x1="120" y1="176.5" x2="740" y2="176.5" stroke="rgba(232,236,240,0.08)"/>
  <line x1="120" y1="122.5" x2="740" y2="122.5" stroke="rgba(232,236,240,0.08)"/>
  <line x1="120" y1="68.5" x2="740" y2="68.5" stroke="rgba(232,236,240,0.08)"/>

