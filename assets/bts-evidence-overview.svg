  <rect x="292" y="200" width="110" height="30" rx="8" fill="#A7B6C5"/>
  <rect x="450" y="148" width="110" height="82" rx="8" fill="#466C96"/>
  <rect x="608" y="192" width="110" height="38" rx="8" fill="#C6D0DA"/>

