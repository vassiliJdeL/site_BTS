  <text x="347" y="190" fill="#F2F3F5" font-family="'Source Sans 3', sans-serif" font-size="26" font-weight="600" text-anchor="middle">16</text>
  <text x="505" y="138" fill="#F2F3F5" font-family="'Source Sans 3', sans-serif" font-size="26" font-weight="600" text-anchor="middle">43</text>
  <text x="663" y="182" fill="#F2F3F5" font-family="'Source Sans 3', sans-serif" font-size="26" font-weight="600" text-anchor="middle">20</text>

  <text x="189" y="257" fill="#E8ECF0" font-family="'Source Sans 3', sans-serif" font-size="16" font-weight="500" text-anchor="middle">BTS documentés</text>
  <text x="347" y="257" fill="#E8ECF0" font-family="'Source Sans 3', sans-serif" font-size="16" font-weight="500" text-anchor="middle">CCF</text>
