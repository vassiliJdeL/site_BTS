server {
    listen 80;
    listen [::]:80;
    server_name bts.grades-education.fr www.bts.grades-education.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/bts.grades-education.fr;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bts.grades-education.fr www.bts.grades-education.fr;

    ssl_certificate /etc/letsencrypt/live/bts.grades-education.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bts.grades-education.fr/privkey.pem;

    root /var/www/bts.grades-education.fr;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /xenophon/test/ {
        auth_basic "Xenophon BTS Test";
        auth_basic_user_file /etc/nginx/.htpasswd-bts-xenophon;
        try_files $uri $uri/ =404;
    }

    location /api/v1/ {
        auth_basic "Xenophon BTS Test";
        auth_basic_user_file /etc/nginx/.htpasswd-bts-xenophon;
        proxy_pass http://127.0.0.1:8011/api/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 25m;
    }

    location /webhook/ {
        proxy_pass http://127.0.0.1:5678/webhook/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 10m;
    }
}
